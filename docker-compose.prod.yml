version: '3.8'
services:
  backend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.sa-east-1.amazonaws.com/erp-backend:latest
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=${DATABASE_URL}
    restart: always

  redis:
    image: redis:alpine
    restart: always