# Sobrescreve docker-compose.yml automaticamente em ambiente de desenvolvimento.
# Não precisa especificar -f: docker compose up já carrega este arquivo.

services:

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    build:
      target: development
    container_name: erp_backend_dev
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT:       Development
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "1"
    # Monta o código-fonte; bin/ e obj/ ficam em volumes anônimos para evitar
    # conflito com builds do host Windows
    volumes:
      - ./backend:/app
      - backend_bin_api:/app/src/ERP.API/bin
      - backend_obj_api:/app/src/ERP.API/obj
      - backend_bin_app:/app/src/ERP.Application/bin
      - backend_obj_app:/app/src/ERP.Application/obj
      - backend_bin_domain:/app/src/ERP.Domain/bin
      - backend_obj_domain:/app/src/ERP.Domain/obj
      - backend_bin_infra:/app/src/ERP.Infrastructure/bin
      - backend_obj_infra:/app/src/ERP.Infrastructure/obj
    command: >
      dotnet watch run
      --project src/ERP.API/ERP.API.csproj
      --urls http://+:8080
      --no-hot-reload
    # health check mais rápido em dev
    healthcheck:
      start_period: 60s

  frontend:
    build:
      target: development
    container_name: erp_frontend_dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: npm run dev

# Volumes anônimos para artefatos de build (ficam dentro do container)
volumes:
  backend_bin_api:
  backend_obj_api:
  backend_bin_app:
  backend_obj_app:
  backend_bin_domain:
  backend_obj_domain:
  backend_bin_infra:
  backend_obj_infra:
  frontend_node_modules:
  frontend_next:
